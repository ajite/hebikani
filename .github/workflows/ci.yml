name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  Quality:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9"]
        poetry-version: ["1.6.1"]
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    outputs:
      coverage_percent: ${{ steps.coverage.outputs.coverage_percent }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Poetry
      uses: abatilo/actions-poetry@v3
      with:
        poetry-version: ${{ matrix.poetry-version }}
    - name: Set Poetry config
      run: |
        poetry config virtualenvs.in-project false
        poetry config virtualenvs.path ~/.virtualenvs
    - name: Install system dependencies
      run: |
        brew install cairo libffi
        echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib" >> $GITHUB_ENV
    - name: Install Dependencies
      run: poetry install
    - name: Lint with flake8
      run: poetry run flake8 . --count --show-source --statistics
    - name: Check formatting with black
      run: poetry run black --check hebikani tests
    - name: Test with pytest
      id: coverage
      run: |
        poetry run coverage run -m pytest
        COVERAGE=$(poetry run coverage report | awk '$1 == "TOTAL" {print $NF+0}')
        echo "coverage_percent=$COVERAGE" >> "$GITHUB_OUTPUT"

  Badge:
    needs: Quality
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    # A stale gist token must not block the release.
    continue-on-error: true
    steps:
      - name: Create Coverage Badge
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: c90a126b4e926b94c07a36ac78e9a9ad
          filename: hebikani_coverage.json
          label: coverage
          message: ${{ needs.Quality.outputs.coverage_percent }}
          namedLogo: pytest
          color: blue
          logoColor: lightblue

  Release:
    needs: Quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    concurrency: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python Semantic Release
        uses: python-semantic-release/python-semantic-release@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
